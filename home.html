<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/home.css">
    <title>Weather App | Live Forecast</title>
</head>

<body>
    <section class="whole">
        <header>
            <div class="card">
                <div class="search">
                    <input type="text" id="citySearch" placeholder="Enter city name" spellcheck="false">
                    <button id="searchBtn">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </header>

        <div id="citiesList"></div>
        <div id="weatherResults"></div>

        <section id="area" class="happening">
            <div id="cityName">Kampala</div>
            <img id="weatherIcon" src="https://openweathermap.org/img/wn/10d@4x.png" alt="Weather Icon">
            <div class="weather-info">
                <div id="temperature">--°C</div>
                <div id="conditions">--</div>
                <div id="humidity"><i class="fas fa-tint"></i> Humidity: --%</div>
            </div>
        </section>
    </section>

    <script src="javascript/home.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
